# HackPDM Production Nginx Reverse Proxy Configuration
# Install to /etc/nginx/sites-available/hackpdm.conf and symlink into /etc/nginx/sites-enabled/.
# Replace pdm.example.com and certificate paths with your domain and CA/Let's Encrypt certificates.

limit_req_zone $binary_remote_addr zone=hackpdm_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=hackpdm_rpc:10m rate=120r/m;

upstream hackpdm_odoo {
    server 127.0.0.1:8069;
    keepalive 32;
}

upstream hackpdm_odoo_gevent {
    server 127.0.0.1:8072;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name pdm.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pdm.example.com;

    # TLS 1.2+ / TLS 1.3 only
    ssl_certificate     /etc/letsencrypt/live/pdm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:HackPDMSSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload & timeout tuning (aligned with Odoo 128 MiB cap + base64 overhead and limit_time_real=1200)
    client_max_body_size 160m;
    proxy_connect_timeout 60s;
    proxy_send_timeout    1200s;
    proxy_read_timeout    1200s;
    proxy_request_buffering on;
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    # Forwarded headers (requires proxy_mode = True in odoo.conf)
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP         $remote_addr;

    # Block database manager endpoints unconditionally
    location ~* ^/web/database {
        return 403;
    }

    # Rate-limit interactive login against credential stuffing
    location = /web/login {
        limit_req zone=hackpdm_login burst=5 nodelay;
        proxy_pass http://hackpdm_odoo;
    }

    # Allow bursty JSON-RPC traffic for CAD commits and chunked transfers
    location = /jsonrpc {
        limit_req zone=hackpdm_rpc burst=200 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://hackpdm_odoo;
    }

    # Odoo websocket / gevent bus (for web UI)
    location /websocket {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://hackpdm_odoo_gevent;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_pass http://hackpdm_odoo;
    }
}
