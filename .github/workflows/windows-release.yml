name: Windows build

# Builds the Windows client (the main platform) in Release, runs the unit tests on Windows, and
# packages a self-contained win-x64 build as a zip and a per-user installer, each with its SHA-256.
# A tag vX.Y.Z builds version X.Y.Z and publishes a GitHub release with those files.
#
# Code signing runs only when these repository secrets are set:
#   WINDOWS_CERT_PFX_BASE64  the code-signing certificate (.pfx), base64-encoded
#   WINDOWS_CERT_PASSWORD    its password
#
# Automatic update rollout to Odoo runs on v* tags when these repository secrets are set:
#   ODOO_URL                 e.g. https://pdm.example.com
#   ODOO_DB                  Odoo database name
#   ODOO_USER                Admin login
#   ODOO_PASSWORD            Admin password or API key
# Optional repository variable:
#   CLIENT_VERSION_RULE      Required client_version range (defaults to ">=1.1.0, <2.0.0" for soft rollout,
#                            or set to "exact" / "min" / custom range like ">=1.2.0, <2.0.0").
# You can also roll out or roll back any release manually via .github/workflows/rollout-update.yml.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "Src/**"
      - "installer/**"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/windows-release.yml"
  pull_request:
    paths:
      - "Src/**"
      - "installer/**"
      - "global.json"
      - "Directory.Build.props"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      WINDOWS_TFM: net10.0-windows10.0.26100.0
      # "true" when the signing certificate secret is set (a step's if cannot read secrets)
      HAS_CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # vX.Y.Z (or vX.Y.Z-rc1) tag -> X.Y.Z; otherwise the version in Directory.Build.props
      - name: Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)(?:-[0-9A-Za-z.-]+)?$') {
            $version = $Matches[1]
            $tagName = $env:GITHUB_REF -replace '^refs/tags/', ''
            $isPrerelease = $tagName.Contains('-')
          } elseif ((Get-Content Directory.Build.props -Raw) -match '<HackPdmVersion[^>]*>([^<]+)</HackPdmVersion>') {
            $version = $Matches[1].Trim()
            $isPrerelease = $false
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "could not work out the version (got '$version')" }
          "HACKPDM_VERSION=$version" >> $env:GITHUB_ENV
          "IS_PRERELEASE=$($isPrerelease.ToString().ToLower())" >> $env:GITHUB_ENV
          Write-Host "Building HackPDM $version (prerelease=$isPrerelease)"

      # no Odoo here: the live-server tests skip themselves; they run in odoo-integration.yml
      - name: Unit tests (Windows)
        run: >-
          dotnet test Src/HackPDM.Tests/HackPDM.Tests.csproj -c Release
          -p:HackPdmVersion=${{ env.HACKPDM_VERSION }}
          --logger "trx;LogFileName=windows-tests.trx" --results-directory TestResults

      - name: Publish (Release, self-contained win-x64)
        run: >-
          dotnet publish Src/HackPDM/HackPDM.csproj -c Release -f ${{ env.WINDOWS_TFM }}
          -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true
          -p:WindowsPackageType=None -p:HackPdmVersion=${{ env.HACKPDM_VERSION }}
          -o publish/HackPDM

      - name: Check the built version
        shell: pwsh
        run: |
          $exe = Get-Item publish/HackPDM/HackPDM.exe
          $file = $exe.VersionInfo.FileVersion
          if ($file -ne "$env:HACKPDM_VERSION.0") { throw "HackPDM.exe is version $file, expected $env:HACKPDM_VERSION.0" }

      - name: Sign and verify the app
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $files = Get-ChildItem publish/HackPDM -Include HackPDM.exe,HackPDM*.dll -Recurse
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:CERT_PASSWORD $files.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
            & $signtool.FullName verify /pa /v publish/HackPDM/HackPDM.exe
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for HackPDM.exe" }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:HACKPDM_VERSION" "/DSourceDir=..\publish\HackPDM" "/DOutputDir=..\artifacts" installer\HackPDM.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }

      - name: Sign and verify the installer
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            $setup = (Get-ChildItem artifacts\*-setup.exe).FullName
            & $signtool.FullName sign /fd sha256 /tr http://timestamp.digicert.com /td sha256 /f $pfx /p $env:CERT_PASSWORD $setup
            if ($LASTEXITCODE -ne 0) { throw "signing failed" }
            & $signtool.FullName verify /pa /v $setup
            if ($LASTEXITCODE -ne 0) { throw "signature verification failed for installer" }
          } finally {
            Remove-Item $pfx -ErrorAction SilentlyContinue
          }

      - name: Zip and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/HackPDM/* -DestinationPath "artifacts/HackPDM-$env:HACKPDM_VERSION-win-x64.zip"
          Get-ChildItem artifacts -File | Where-Object Extension -ne '.sha256' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -NoNewline -Encoding ascii "$($_.FullName).sha256"
            Write-Host "$hash  $($_.Name)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hackpdm-${{ env.HACKPDM_VERSION }}-win-x64
          path: artifacts
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: TestResults
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hackpdm-*-win-x64
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  rollout-odoo:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ODOO_URL: ${{ secrets.ODOO_URL }}
      ODOO_DB: ${{ secrets.ODOO_DB }}
      ODOO_USER: ${{ secrets.ODOO_USER }}
      ODOO_PASSWORD: ${{ secrets.ODOO_PASSWORD }}
      CLIENT_VERSION_RULE: ${{ vars.CLIENT_VERSION_RULE }}
    steps:
      - name: Check Odoo rollout secrets
        id: check
        shell: bash
        run: |
          if [ -n "$ODOO_URL" ] && [ -n "$ODOO_DB" ] && [ -n "$ODOO_USER" ] && [ -n "$ODOO_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping automatic Odoo rollout (ODOO_URL / ODOO_DB / ODOO_USER / ODOO_PASSWORD secrets not configured)."
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          pattern: hackpdm-*-win-x64
          path: artifacts
          merge-multiple: true

      - name: Publish release metadata to Odoo hp.settings
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          SETUP_FILE="$(basename "$(ls artifacts/HackPDM-*-win-x64-setup.exe | head -n1)")"
          SHA256="$(awk '{print $1}' "artifacts/${SETUP_FILE}.sha256" | tr -d '[:space:]')"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${SETUP_FILE}"
          MAJOR="${VERSION%%.*}"
          NEXT_MAJOR=$((MAJOR + 1))

          case "${CLIENT_VERSION_RULE}" in
            ""|"soft")
              VERSION_RULE=">=${MAJOR}.0.0, <${NEXT_MAJOR}.0.0"
              ;;
            "min")
              VERSION_RULE=">=${VERSION}, <${NEXT_MAJOR}.0.0"
              ;;
            "exact")
              VERSION_RULE="${VERSION}"
              ;;
            *)
              VERSION_RULE="${CLIENT_VERSION_RULE}"
              ;;
          esac

          python3 Odoo/deploy/publish_client_release.py \
            "${VERSION_RULE}" \
            "${DOWNLOAD_URL}" \
            "${SHA256}" \
            --latest-version "${VERSION}"
